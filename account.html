<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — Proyjon Marketing LTD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #07101d; color: #fff; min-height: 100vh; padding: 20px; padding-bottom: 90px; }
    .container { max-width: 520px; margin: auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
    .back-btn, .edit-btn { background: #18263a; border: 1px solid #34465f; color: white; padding: 10px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    .profile-card { background: #101c2c; border: 1px solid #25374e; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
    .info-group { margin-bottom: 14px; }
    .info-label { color: #8190a4; font-size: 11px; margin-bottom: 4px; }
    .info-value { font-size: 14px; font-weight: bold; color: #fff; }
    .input { width: 100%; padding: 12px; background: #0a1422; border: 1px solid #2b3d55; color: #cbd5e1; border-radius: 11px; font-size: 13px; }
    .save-btn { width: 100%; background: #22c55e; border: none; color: #07101d; padding: 14px; border-radius: 13px; font-weight: bold; margin-top: 15px; cursor: pointer; display: none; }
    .error-box { display: none; background: #35151a; border: 1px solid #693039; color: #ffb8c0; border-radius: 14px; padding: 12px; margin-bottom: 15px; font-size: 12px; }
    .success-box { display: none; background: #143525; border: 1px solid #256943; color: #b8ffda; border-radius: 14px; padding: 12px; margin-bottom: 15px; font-size: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <button class="back-btn" onclick="history.back()">← Back</button>
      <h2>My Account</h2>
      <button class="edit-btn" id="editToggleBtn" onclick="toggleEdit()">✎ Edit Information</button>
    </div>

    <div id="errorBox" class="error-box"></div>
    <div id="successBox" class="success-box"></div>

    <div class="profile-card" id="profileView">
      <div class="info-group"><div class="info-label">Name</div><div class="info-value" id="viewName">-</div></div>
      <div class="info-group"><div class="info-label">Father's Name</div><div class="info-value" id="viewFather">-</div></div>
      <div class="info-group"><div class="info-label">Phone</div><div class="info-value" id="viewPhone">-</div></div>
      <div class="info-group"><div class="info-label">Email</div><div class="info-value" id="viewEmail">-</div></div>
      <div class="info-group"><div class="info-label">NID</div><div class="info-value" id="viewNid">-</div></div>
      <div class="info-group"><div class="info-label">Address</div><div class="info-value" id="viewAddress">-</div></div>
      <div class="info-group"><div class="info-label">Nominee Name</div><div class="info-value" id="viewNomineeName">-</div></div>
      <div class="info-group"><div class="info-label">Nominee Number</div><div class="info-value" id="viewNomineeNum">-</div></div>
      <div class="info-group"><div class="info-label">Nominee NID</div><div class="info-value" id="viewNomineeNid">-</div></div>
    </div>

    <form class="profile-card" id="profileForm" style="display:none;" onsubmit="handleUpdate(event)">
      <div class="info-group"><label class="info-label">Name</label><input type="text" id="inpName" class="input" required></div>
      <div class="info-group"><label class="info-label">Father's Name</label><input type="text" id="inpFather" class="input"></div>
      <div class="info-group"><label class="info-label">Phone</label><input type="text" id="inpPhone" class="input"></div>
      <div class="info-group"><label class="info-label">Email</label><input type="email" id="inpEmail" class="input" required></div>
      <div class="info-group"><label class="info-label">NID</label><input type="text" id="inpNid" class="input"></div>
      <div class="info-group"><label class="info-label">Address</label><input type="text" id="inpAddress" class="input"></div>
      <div class="info-group"><label class="info-label">Nominee Name</label><input type="text" id="inpNomineeName" class="input"></div>
      <div class="info-group"><label class="info-label">Nominee Number</label><input type="text" id="inpNomineeNum" class="input"></div>
      <div class="info-group"><label class="info-label">Nominee NID</label><input type="text" id="inpNomineeNid" class="input"></div>
      <button type="submit" class="save-btn" id="saveBtn" style="display:block;">Submit for Approval</button>
    </form>
  </div>

  <script>
    const API_URL = "https://mlm-platform-production.up.railway.app";
    const token = localStorage.getItem("token");
    let isEditing = false;

    if (!token) window.location.href = "login.html";

    async function loadProfile() {
      try {
        const res = await fetch(API_URL + "/api/auth/me", {
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        if (data.success && data.user) {
          const u = data.user;
          document.getElementById("viewName").textContent = u.name || '-';
          document.getElementById("viewFather").textContent = u.father_name || '-';
          document.getElementById("viewPhone").textContent = u.phone || '-';
          document.getElementById("viewEmail").textContent = u.email || '-';
          document.getElementById("viewNid").textContent = u.nid || '-';
          document.getElementById("viewAddress").textContent = u.address || '-';
          document.getElementById("viewNomineeName").textContent = u.nominee_name || '-';
          document.getElementById("viewNomineeNum").textContent = u.nominee_number || '-';
          document.getElementById("viewNomineeNid").textContent = u.nominee_nid || '-';

          document.getElementById("inpName").value = u.name || '';
          document.getElementById("inpFather").value = u.father_name || '';
          document.getElementById("inpPhone").value = u.phone || '';
          document.getElementById("inpEmail").value = u.email || '';
          document.getElementById("inpNid").value = u.nid || '';
          document.getElementById("inpAddress").value = u.address || '';
          document.getElementById("inpNomineeName").value = u.nominee_name || '';
          document.getElementById("inpNomineeNum").value = u.nominee_number || '';
          document.getElementById("inpNomineeNid").value = u.nominee_nid || '';

          checkPendingStatus();
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function checkPendingStatus() {
      try {
        const res = await fetch(API_URL + "/api/auth/profile-status", {
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        const editBtn = document.getElementById("editToggleBtn");
        if (data.isPending) {
          editBtn.textContent = "⏳ Pending Approval";
          editBtn.style.background = "#475569";
          editBtn.disabled = true;
        } else {
          editBtn.textContent = "✎ Edit Information";
          editBtn.style.background = "";
          editBtn.disabled = false;
        }
      } catch (e) { console.error(e); }
    }

    function toggleEdit() {
      isEditing = !isEditing;
      document.getElementById("profileView").style.display = isEditing ? "none" : "block";
      document.getElementById("profileForm").style.display = isEditing ? "block" : "none";
      document.getElementById("editToggleBtn").textContent = isEditing ? "Cancel" : "✎ Edit Information";
    }

    async function handleUpdate(e) {
      e.preventDefault();
      const body = {
        name: document.getElementById("inpName").value,
        father_name: document.getElementById("inpFather").value,
        phone: document.getElementById("inpPhone").value,
        email: document.getElementById("inpEmail").value,
        nid: document.getElementById("inpNid").value,
        address: document.getElementById("inpAddress").value,
        nominee_name: document.getElementById("inpNomineeName").value,
        nominee_number: document.getElementById("inpNomineeNum").value,
        nominee_nid: document.getElementById("inpNomineeNid").value
      };

      try {
        const res = await fetch(API_URL + "/api/auth/profile", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("successBox").textContent = data.message;
          document.getElementById("successBox").style.display = "block";
          document.getElementById("errorBox").style.display = "none";
          toggleEdit();
          checkPendingStatus();
        } else {
          document.getElementById("errorBox").textContent = data.message;
          document.getElementById("errorBox").style.display = "block";
        }
      } catch (err) {
        document.getElementById("errorBox").textContent = "Request failed!";
        document.getElementById("errorBox").style.display = "block";
      }
    }

    loadProfile();
  </script>
</body>
</html>
