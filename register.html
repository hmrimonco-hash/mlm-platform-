<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Proyojon Marketing LTD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top right, #243b7a 0%, transparent 35%),
        radial-gradient(circle at bottom left, #182848 0%, transparent 40%),
        #070b14;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .register-card {
      width: 100%;
      max-width: 430px;
      padding: 30px 25px;
      border-radius: 24px;
      background: rgba(20, 28, 52, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(15px);
    }

    .brand-logo {
      width: 70px; height: 70px; margin: 0 auto 16px;
      border-radius: 18px; object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background-color: #070b14; display: block;
    }

    .brand { text-align: center; }
    .brand h1 { font-size: 22px; font-weight: 700; }
    .brand p { margin-top: 7px; color: #aeb8d0; font-size: 13px; }

    .title { margin-top: 24px; text-align: center; font-size: 19px; font-weight: 600; }
    .subtitle { margin-top: 7px; text-align: center; color: #8995b2; font-size: 13px; margin-bottom: 20px;}

    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 7px; color: #dbe2f4; font-size: 13px; font-weight: 600; }
    .required-star { color: #ef4444; margin-left: 2px; }

    .input-box { position: relative; }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; opacity: 0.75; }

    input {
      width: 100%; height: 49px; padding: 0 43px;
      border-radius: 12px; border: 1px solid #303b59;
      background: #10182c; color: #ffffff; font-size: 14px;
      outline: none; transition: 0.2s;
    }
    input::placeholder { color: #68748f; }
    input:focus { border-color: #5576e8; box-shadow: 0 0 0 3px rgba(85, 118, 232, 0.12); }

    .password-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      border: none; background: transparent; color: #8490aa;
      font-size: 17px; cursor: pointer;
    }

    .register-btn {
      width: 100%; height: 52px; margin-top: 5px; border: none;
      border-radius: 12px; background: linear-gradient(135deg, #3157d5, #673ab7);
      color: white; font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 10px 25px rgba(49, 87, 213, 0.25); transition: 0.3s;
    }
    .register-btn:hover { transform: translateY(-2px); }
    .register-btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    .message {
      display: none; margin-top: 15px; padding: 12px; border-radius: 10px;
      text-align: center; font-size: 13px; line-height: 1.5;
    }
    .message.error { display: block; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.25); color: #ff9b9b; }
    .message.success { display: block; background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.25); color: #8ef0ad; }

    .login-link { margin-top: 21px; text-align: center; color: #8995b2; font-size: 13px; }
    .login-link a { color: #8299e9; font-weight: 600; text-decoration: none; }
    .login-link a:hover { color: #a9b9ff; }
    .footer { margin-top: 20px; text-align: center; color: #65708a; font-size: 11px; }

    /* OTP Section */
    #otpSection { display: none; text-align: center; }
    .otp-text { font-size: 13px; color: #aeb8d0; margin-bottom: 20px; line-height: 1.5; }
    .otp-email-highlight { color: #8299e9; font-weight: bold; }
    
    #step1 { transition: 0.3s; }
  </style>
</head>
<body>

  <div class="register-card">

    <img src="logo.jpg" alt="Logo" class="brand-logo" onerror="this.onerror=null; this.outerHTML='<div style=\'width:70px;height:70px;margin:0 auto 16px;border-radius:18px;background:linear-gradient(135deg,#3157d5,#673ab7);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;\'>P</div>';">

    <div class="brand">
      <h1>Proyojon Marketing LTD</h1>
      <p>আপনার প্রয়োজন আমাদের আয়োজন</p>
    </div>

    <div class="title" id="formTitle">Create Your Account</div>
    <div class="subtitle" id="formSubtitle">Join our network today</div>

    <!-- 🔥 STEP 1: Details Form 🔥 -->
    <div id="step1">
      <form class="form" id="registerForm">
        <div class="field">
          <label for="name">Full Name <span class="required-star">*</span></label>
          <div class="input-box">
            <span class="input-icon">👤</span>
            <input type="text" id="name" placeholder="Enter your full name" required>
          </div>
        </div>

        <div class="field">
          <label for="email">Email <span class="required-star">*</span></label>
          <div class="input-box">
            <span class="input-icon">✉️</span>
            <input type="email" id="email" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="field">
          <label for="phone">Phone Number <span class="required-star">*</span></label>
          <div class="input-box">
            <span class="input-icon">📱</span>
            <input type="tel" id="phone" placeholder="01XXXXXXXXX" required>
          </div>
        </div>

        <div class="field">
          <label for="referral_code">Referral Code <span class="required-star">*</span></label>
          <div class="input-box">
            <span class="input-icon">🔗</span>
            <input type="text" id="referral_code" placeholder="Enter sponsor's code" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password <span class="required-star">*</span></label>
          <div class="input-box">
            <span class="input-icon">🔑</span>
            <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required>
            <button type="button" class="password-toggle" id="togglePassword">👁️</button>
          </div>
        </div>

        <button type="submit" class="register-btn" id="sendOtpBtn">Send OTP</button>
      </form>
    </div>

    <!-- 🔥 STEP 2: OTP Verification Box 🔥 -->
    <div id="otpSection">
      <p class="otp-text">We have sent a 6-digit verification code to <br><span class="otp-email-highlight" id="displayEmail"></span></p>
      
      <div class="field" style="text-align: left;">
        <label for="otpCode">Enter OTP <span class="required-star">*</span></label>
        <div class="input-box">
          <span class="input-icon">🔐</span>
          <input type="number" id="otpCode" placeholder="Enter 6-digit OTP" required>
        </div>
      </div>
      
      <button type="button" class="register-btn" id="verifyBtn">Verify & Create Account</button>
      
      <div style="margin-top: 15px; font-size: 12px; color: #8995b2;">
        Didn't receive code? <a href="#" style="color: #8299e9; text-decoration: none;">Resend OTP</a>
      </div>
    </div>

    <!-- Message Box -->
    <div class="message" id="message"></div>

    <div class="login-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>

    <div class="footer">
      © 2026 Proyojon Marketing LTD
    </div>

  </div>

  <script>
    const API_URL = "https://mlm-platform-production.up.railway.app";
    
    // UI Elements
    const step1 = document.getElementById("step1");
    const otpSection = document.getElementById("otpSection");
    const formTitle = document.getElementById("formTitle");
    const formSubtitle = document.getElementById("formSubtitle");
    const displayEmail = document.getElementById("displayEmail");
    
    const registerForm = document.getElementById("registerForm");
    const sendOtpBtn = document.getElementById("sendOtpBtn");
    const verifyBtn = document.getElementById("verifyBtn");
    const message = document.getElementById("message");
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    let userData = {}; // To store data temporarily before OTP verification

    // Show/Hide Password
    togglePassword.addEventListener("click", function() {
      if (password.type === "password") {
        password.type = "text";
        togglePassword.textContent = "🙈";
      } else {
        password.type = "password";
        togglePassword.textContent = "👁️";
      }
    });

    function showMessage(text, type) {
      message.className = "message " + type;
      message.textContent = text;
      message.style.display = "block";
    }

    // Step 1: Submit Form & Request OTP
    registerForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      message.style.display = "none";
      
      userData = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        referral_code: document.getElementById("referral_code").value.trim(),
        password: password.value
      };

      sendOtpBtn.disabled = true;
      sendOtpBtn.textContent = "Sending OTP...";

      try {
        // Backend e ekti notun route banate hobe '/api/auth/send-otp' nam e
        const response = await fetch(API_URL + "/api/auth/send-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: userData.email, phone: userData.phone })
        });

        const data = await response.json();

        // ⚠️ API jodi true return kore tobei samne agabe. 
        // Apatoto API na thakle ekhane test korar jonno jodi amra condition ta bypass kori:
        if (data.success || response.status === 404) { 
          // Note: 404 deya ache jate apnar backend API toiri na thakleo design ta apni dekhte paren. 
          // Pore 404 soriye diben.
          
          step1.style.display = "none";
          otpSection.style.display = "block";
          
          formTitle.textContent = "OTP Verification";
          formSubtitle.textContent = "Almost there!";
          displayEmail.textContent = userData.email;
          
          showMessage("OTP has been sent successfully!", "success");
        } else {
          showMessage(data.message || "Failed to send OTP.", "error");
        }
      } catch (error) {
        // Testing purpose, API na thakle jate frontend test kora jay
        step1.style.display = "none";
        otpSection.style.display = "block";
        formTitle.textContent = "OTP Verification";
        formSubtitle.textContent = "Almost there!";
        displayEmail.textContent = userData.email;
        showMessage("OTP Screen (Demo). Backend connection failed.", "error");
      } finally {
        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = "Send OTP";
      }
    });

    // Step 2: Verify OTP & Create Account
    verifyBtn.addEventListener("click", async function() {
      const otpCode = document.getElementById("otpCode").value.trim();
      
      if(!otpCode || otpCode.length < 4) {
        showMessage("Please enter a valid OTP code.", "error");
        return;
      }

      message.style.display = "none";
      verifyBtn.disabled = true;
      verifyBtn.textContent = "Verifying...";

      // Ekhane backend er main register route e OTP soho data pathabo
      const finalData = { ...userData, otp: otpCode };

      try {
        const response = await fetch(API_URL + "/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(finalData)
        });

        const data = await response.json();

        if (data.success) {
          showMessage("✓ Account Verified & Created successfully!", "success");
          setTimeout(function() { window.location.href = "login.html"; }, 1500);
        } else {
          showMessage(data.message || "Invalid OTP or Registration failed.", "error");
        }
      } catch (error) {
        console.error(error);
        showMessage("Server-এর সাথে connection করা যাচ্ছে না।", "error");
      } finally {
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Verify & Create Account";
      }
    });
  </script>

</body>
</html>
